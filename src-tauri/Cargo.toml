[package]
name = "mailvault"
version = "2.11.0"
description = "A reactive email client with local storage"
authors = ["MailVault"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# `mailto:` handed over by the OS. The single-instance feature above is what
# makes a click reach the running app instead of starting a second one.
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
base64 = "0.22"
dirs = "5"
mailparse = "0.15"
mailvault-core = { path = "../src-core" }
walkdir = "2"
zip = "2"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "rt", "macros"] }
async-imap = { version = "0.11", features = ["compress"] }
imap-proto = "0.16"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
rand = "0.9"
url = "2"
hickory-resolver = "0.26"
tauri-plugin-webdriver-automation = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-sparkle-updater = { version = "0.2", optional = true }
# StoreKit bindings — Mac App Store IAP (enabled by `appstore` feature)
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-store-kit = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
# Already in the lock through wry — the switch for WebKitGTK's spell checker
# lives on the web context, which nothing in tauri's API surface exposes.
webkit2gtk = "2.0"
tauri-plugin-updater = "2"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol", "sparkle"]
custom-protocol = ["tauri/custom-protocol"]
webdriver = ["tauri-plugin-webdriver-automation"]
# Developer ID / non-MAS macOS builds use Sparkle for auto-updates.
sparkle = ["dep:tauri-plugin-sparkle-updater"]
# Mac App Store build: drops Sparkle, enables StoreKit IAP for paid features.
appstore = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-store-kit", "dep:block2"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
