<table width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#e8eef7"><tr>
  <td width="200" height="40" bgcolor="#d0dcf0" style="font:14px Arial,sans-serif">Fixed table, cell 200</td>
  <td width="200" height="40" bgcolor="#b8c9e8" style="font:14px Arial,sans-serif">Cell 200</td>
  <td width="200" height="40" bgcolor="#a0b6e0" style="font:14px Arial,sans-serif">Cell 200</td>
</tr></table>
<p style="font:14px Arial,sans-serif;margin:12px 0">The leemunroe shape: a fixed-width cell inside a full-width table.</p>
<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f5f6"><tr>
  <td bgcolor="#eaebed" style="font:14px Arial,sans-serif">&nbsp;</td>
  <td width="600" style="width:600px;max-width:600px;padding:12px;background:#ffffff;font:14px Arial,sans-serif">Container cell, width 600 max-width 600</td>
  <td bgcolor="#eaebed" style="font:14px Arial,sans-serif">&nbsp;</td>
</tr></table>
