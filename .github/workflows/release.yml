name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.2)'
        required: true
        type: string

jobs:
  # ── E2E Tests (disabled — uncomment to enable) ──
  # Runs UI-only E2E tests on macOS. Connected tests are skipped in CI
  # because they require IMAP accounts in the system keychain.
  # Uses tauri-webdriver-automation (macOS WKWebView only).
  #
  # e2e-tests:
  #   permissions:
  #     contents: read
  #   runs-on: macos-latest
  #   timeout-minutes: 30
  #
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v5
  #
  #     - name: Install Rust stable
  #       uses: dtolnay/rust-toolchain@stable
  #
  #     - name: Cache Rust dependencies
  #       uses: actions/cache@v5
  #       with:
  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #           src-tauri/target
  #         key: macos-e2e-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
  #         restore-keys: |
  #           macos-e2e-cargo-
  #
  #     - name: Install Node.js
  #       uses: actions/setup-node@v5
  #       with:
  #         node-version: 24
  #         cache: 'npm'
  #
  #     - name: Install frontend dependencies
  #       run: npm ci
  #
  #     - name: Install tauri-webdriver-automation
  #       run: cargo install tauri-webdriver-automation
  #
  #     - name: Build debug binary with WebDriver support
  #       run: npx tauri build --debug --features webdriver
  #
  #     - name: Run UI E2E tests
  #       run: npm run test:e2e:ui

  build-macos:
    permissions:
      contents: write
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  build-linux-x86_64:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-x86_64-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build daemon sidecar
        env:
          TAURI_TARGET: x86_64-unknown-linux-gnu
        run: npm run build:daemon

      - name: Build Linux x86_64
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # The Rust cache restores target/, which brings back the PREVIOUS release's
        # bundle. The upload globs then ship both versions and the release job's
        # `find | head -1` can pick the old one. Start from an empty bundle dir.
        run: |
          rm -rf target/x86_64-unknown-linux-gnu/release/bundle
          npx tauri build --target x86_64-unknown-linux-gnu --bundles deb

      - name: Upload Linux x86_64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-x86_64-artifacts
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig
          retention-days: 1

  build-linux-aarch64:
    permissions:
      contents: write
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-aarch64-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build daemon sidecar
        env:
          TAURI_TARGET: aarch64-unknown-linux-gnu
        run: npm run build:daemon

      - name: Build Linux aarch64
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # See the x86_64 job: the cached target/ carries the previous release's
        # bundle, which is how v2.8.0's latest.json ended up pointing aarch64
        # users at the 2.7.0 .deb.
        run: |
          rm -rf target/aarch64-unknown-linux-gnu/release/bundle
          npx tauri build --target aarch64-unknown-linux-gnu --bundles deb

      - name: Upload Linux aarch64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-aarch64-artifacts
          path: |
            target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb.sig
          retention-days: 1

  build-snap-x86_64:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-x86_64-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build daemon sidecar
        env:
          TAURI_TARGET: x86_64-unknown-linux-gnu
        run: npm run build:daemon

      - name: Build Tauri binary
        run: npx tauri build --target x86_64-unknown-linux-gnu --no-bundle

      - name: Prepare snap staging
        env:
          TAURI_TARGET: x86_64-unknown-linux-gnu
        run: bash scripts/build-snap-staging.sh

      - name: Install snapcraft and GNOME extension snaps
        run: |
          sudo snap install snapcraft --classic
          sudo snap install gnome-42-2204 gnome-42-2204-sdk gtk-common-themes

      - name: Build snap
        run: snapcraft --destructive-mode

      - name: Upload snap artifact
        uses: actions/upload-artifact@v6
        with:
          name: snap-x86_64-artifact
          path: "*.snap"
          retention-days: 1

  build-snap-aarch64:
    permissions:
      contents: write
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-aarch64-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build daemon sidecar
        env:
          TAURI_TARGET: aarch64-unknown-linux-gnu
        run: npm run build:daemon

      - name: Build Tauri binary
        run: npx tauri build --target aarch64-unknown-linux-gnu --no-bundle

      - name: Prepare snap staging
        env:
          TAURI_TARGET: aarch64-unknown-linux-gnu
        run: bash scripts/build-snap-staging.sh

      - name: Install snapcraft and GNOME extension snaps
        run: |
          sudo snap install snapcraft --classic
          sudo snap install gnome-42-2204 gnome-42-2204-sdk gtk-common-themes

      - name: Build snap
        run: snapcraft --destructive-mode

      - name: Upload snap artifact
        uses: actions/upload-artifact@v6
        with:
          name: snap-aarch64-artifact
          path: "*.snap"
          retention-days: 1

  build-windows:
    # The `release` environment (main only) is what the Azure federated
    # credential trusts, so this job can sign and a branch run cannot.
    environment: release
    permissions:
      contents: write
      id-token: write
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-x86_64-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build daemon sidecar
        run: npm run build:daemon

      # Compile first, bundle (and sign) later: the Azure login sits right
      # before the bundle step so its short-lived OIDC token is still valid
      # when signtool asks for it, not consumed by a cold compile.
      - name: Build Windows app
        run: |
          rm -rf target/release/bundle
          npx tauri build --no-bundle

      - name: Prepare Artifact Signing
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/1.0.128' -OutFile "$dir\client.zip"
          Expand-Archive -Path "$dir\client.zip" -DestinationPath "$dir\client" -Force
          $dlib = "$dir\client\bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { throw "dlib not found at $dlib" }

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          Write-Host "signtool: $($signtool.FullName)"

          # Only AzureCliCredential (from azure/login) may answer; the rest
          # would be probed first and managed identity can hang on a runner.
          $metadata = @{
            Endpoint = 'https://neu.codesigning.azure.net/'
            CodeSigningAccountName = 'MailVault'
            CertificateProfileName = 'MailVaultApp2'
            ExcludeCredentials = @(
              'ManagedIdentityCredential', 'EnvironmentCredential', 'WorkloadIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          }
          $metadata | ConvertTo-Json | Set-Content -Encoding utf8 "$dir\metadata.json"

          # Signing lives in this overlay only, so a local Windows build stays unsigned.
          $overlay = @{ bundle = @{ windows = @{ signCommand = @{
            cmd  = $signtool.FullName
            args = @('sign', '/v', '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
                     '/dlib', $dlib, '/dmdf', "$dir\metadata.json", '/d', 'MailVault', '%1')
          } } } }
          $overlay | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 "$dir\sign.conf.json"
          Get-Content "$dir\sign.conf.json"
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGN_CONFIG=$dir\sign.conf.json" >> $env:GITHUB_ENV

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The signer role sits on the signing account, not the subscription.
          allow-no-subscriptions: true

      # Tauri swallows signtool's output on failure, so sign one throwaway copy
      # here first: a broken login, role or dlib fails fast and legibly.
      - name: Check signing works
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'sign-probe.exe'
          Copy-Item 'src-tauri\binaries\mailvault-daemon-x86_64-pc-windows-msvc.exe' $probe
          $cfg = Get-Content $env:SIGN_CONFIG | ConvertFrom-Json
          $cmd = $cfg.bundle.windows.signCommand
          # /debug must precede the file, which is the last argument.
          $signArgs = @($cmd.args | ForEach-Object { if ($_ -eq '%1') { '/debug'; $probe } else { $_ } })
          & $cmd.cmd @signArgs
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }

      - name: Bundle and sign NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri bundle --bundles nsis --config "$SIGN_CONFIG"

      # A signCommand that silently did not apply still leaves a green build,
      # so prove the installer carries our publisher before shipping it.
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installers = Get-ChildItem 'target\release\bundle\nsis\*-setup.exe'
          if (-not $installers) { throw 'no NSIS installer was built' }
          foreach ($f in $installers) {
            $out = & $env:SIGNTOOL verify /pa /v $f.FullName | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0 -or $out -notmatch 'MODERNIOS APLIKACIJOS') {
              throw "$($f.Name) is not signed by MODERNIOS APLIKACIJOS"
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-x86_64-artifacts
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          retention-days: 1

  # Snap Store publishing happens in promote-snaps.yml, triggered when the
  # GitHub release is published (or manually via workflow_dispatch).

  create-release:
    needs: [build-macos, build-linux-x86_64, build-linux-aarch64, build-snap-x86_64, build-snap-aarch64, build-windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Build latest.json and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          VERSION_NUM="${INPUT_VERSION#v}"
          VERSION="v${VERSION_NUM}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"

          echo "=== Artifacts collected ==="
          find artifacts/ -type f | sort
          echo "=========================="

          # ── macOS (Sparkle — uses appcast.xml, not latest.json) ──
          APPCAST=$(find artifacts/macos-artifacts -name "appcast.xml" | head -1)
          if [ -n "$APPCAST" ]; then
            cp "$APPCAST" appcast.xml
            echo "Found appcast.xml for macOS Sparkle updater"
          fi

          # ── Linux x86_64 (.deb) ──
          # Pin to this version: an unpinned `find | head -1` once picked a stale
          # cached .deb and published a downgrade as if it were the new release.
          # The .sig is derived from the chosen .deb, never matched separately.
          LX86_DEB=$(find artifacts/linux-x86_64-artifacts -name "*_${VERSION_NUM}_*.deb" | head -1)
          if [ -z "$LX86_DEB" ]; then echo "::error::No x86_64 .deb for ${VERSION_NUM}"; exit 1; fi
          LX86_DEB_NAME=$(basename "$LX86_DEB")
          LX86_SIG=""; [ -f "${LX86_DEB}.sig" ] && LX86_SIG="${LX86_DEB}.sig"

          # ── Linux aarch64 (.deb) ──
          LARM_DEB=$(find artifacts/linux-aarch64-artifacts -name "*_${VERSION_NUM}_*.deb" | head -1)
          if [ -z "$LARM_DEB" ]; then echo "::error::No aarch64 .deb for ${VERSION_NUM}"; exit 1; fi
          LARM_DEB_NAME=$(basename "$LARM_DEB")
          LARM_SIG=""; [ -f "${LARM_DEB}.sig" ] && LARM_SIG="${LARM_DEB}.sig"

          # ── Windows x86_64 (NSIS) ──
          WIN_EXE=$(find artifacts/windows-x86_64-artifacts -name "*_${VERSION_NUM}_*-setup.exe" | head -1)
          if [ -z "$WIN_EXE" ]; then echo "::error::No Windows installer for ${VERSION_NUM}"; exit 1; fi
          WIN_EXE_NAME=$(basename "$WIN_EXE")
          WIN_SIG=""; [ -f "${WIN_EXE}.sig" ] && WIN_SIG="${WIN_EXE}.sig"

          # ── Snap artifacts (may not exist if snap builds skipped) ──
          SNAP_X86=$(find artifacts/snap-x86_64-artifact -name "*.snap" 2>/dev/null | head -1 || true)
          SNAP_ARM=$(find artifacts/snap-aarch64-artifact -name "*.snap" 2>/dev/null | head -1 || true)

          # Extract changelog for this version from CHANGELOG.md
          CHANGELOG_NOTES=$(python3 -c "
          import re
          version = '${VERSION_NUM}'
          with open('CHANGELOG.md') as f:
              content = f.read()
          pattern = rf'^## \[{re.escape(version)}\].*?\n(.*?)(?=^## \[|\Z)'
          m = re.search(pattern, content, re.MULTILINE | re.DOTALL)
          print(m.group(1).strip() if m else 'Bug fixes and improvements.')
          ")
          # JSON-escape for latest.json (handles newlines, quotes, backslashes)
          CHANGELOG_JSON=$(python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))" <<< "$CHANGELOG_NOTES")

          # Build Linux platform entries for latest.json
          # (macOS uses Sparkle appcast.xml, not latest.json)
          LINUX_PLATFORMS=""
          if [ -n "$LX86_SIG" ]; then
            LX86_SIG_CONTENT=$(cat "$LX86_SIG")
            LINUX_PLATFORMS="\"linux-x86_64\": { \"signature\": \"${LX86_SIG_CONTENT}\", \"url\": \"${BASE_URL}/${LX86_DEB_NAME}\" }"
          fi
          if [ -n "$LARM_SIG" ]; then
            LARM_SIG_CONTENT=$(cat "$LARM_SIG")
            if [ -n "$LINUX_PLATFORMS" ]; then LINUX_PLATFORMS="${LINUX_PLATFORMS}, "; fi
            LINUX_PLATFORMS="${LINUX_PLATFORMS}\"linux-aarch64\": { \"signature\": \"${LARM_SIG_CONTENT}\", \"url\": \"${BASE_URL}/${LARM_DEB_NAME}\" }"
          fi

          if [ -n "$WIN_SIG" ]; then
            WIN_SIG_CONTENT=$(cat "$WIN_SIG")
            if [ -n "$LINUX_PLATFORMS" ]; then LINUX_PLATFORMS="${LINUX_PLATFORMS}, "; fi
            LINUX_PLATFORMS="${LINUX_PLATFORMS}\"windows-x86_64\": { \"signature\": \"${WIN_SIG_CONTENT}\", \"url\": \"${BASE_URL}/${WIN_EXE_NAME}\" }"
          fi

          cat > latest.json <<EOJSON
          {
            "version": "${VERSION_NUM}",
            "notes": ${CHANGELOG_JSON},
            "pub_date": "${PUB_DATE}",
            "platforms": { ${LINUX_PLATFORMS} }
          }
          EOJSON

          echo "Generated latest.json (Linux + Windows):"
          cat latest.json

          # Collect all upload files
          UPLOAD_FILES="latest.json"
          if [ -f "appcast.xml" ]; then
            UPLOAD_FILES="$UPLOAD_FILES appcast.xml"
          fi
          for f in $(find artifacts/ -type f); do
            BASE=$(basename "$f")
            # Skip appcast.xml from artifacts — already added from the copy above
            if [ "$BASE" = "appcast.xml" ]; then continue; fi
            # Never attach an installer from another version: a cached build dir
            # can leave the previous release's .deb/.dmg/.snap behind.
            case "$BASE" in
              *.deb|*.deb.sig|*.dmg|*.snap|*.exe|*.exe.sig)
                if ! echo "$BASE" | grep -q "${VERSION_NUM}"; then
                  echo "Skipping stale artifact: $BASE"
                  continue
                fi
                ;;
            esac
            UPLOAD_FILES="$UPLOAD_FILES $f"
          done

          # --draft never creates the git tag; GitHub creates it when the draft is
          # published, at --target. Pin the target to the commit CI built so a
          # publish after main moves on still tags the right commit.
          gh release create "$VERSION" \
            --target "${{ github.sha }}" \
            --title "MailVault v${VERSION_NUM}" \
            --notes "${CHANGELOG_NOTES:-See the assets to download and install this version.}" \
            --draft \
            $UPLOAD_FILES

          echo "Draft release created: $VERSION"
