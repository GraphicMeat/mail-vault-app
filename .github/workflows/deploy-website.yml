name: Deploy Website

# Deploys website/ static + website/api/ Node service to Hetzner sda-prod.
#
# Triggers on push to main affecting website/. Splits writes:
#   - Static HTML/assets → /var/www/mailvaultapp (Caddy file_server)
#   - Node API source    → /opt/mailvault-api (runs as mailvault-api.service)
#   - CI-managed secrets → /etc/mailvault-api/secrets.env
# Server-local DB config in /etc/mailvault-api/.env is NEVER touched.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY            Private key authorized on Hetzner (matches an /root/.ssh/authorized_keys entry)
#   DEPLOY_HOST               178.104.231.107
#   DEPLOY_USER               root
#   DEPLOY_KNOWN_HOSTS        Output of: ssh-keyscan -t ed25519,rsa 178.104.231.107
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_PRICE_MONTHLY_EUR
#   STRIPE_PRICE_YEARLY_EUR
#   GRAPHICMEAT_PARTNER_URL   https://graphicmeat.com
#   GRAPHICMEAT_PARTNER_KEY   Must equal PARTNER_API_KEY in graphicmeat.com
#   IP_SALT                   Random 32+ char string
#   ADMIN_KEY                 Random 32+ char string
#
# SMTP_HOST/PORT/USER/PASS and NOTIFY_EMAIL are gone: this site sends no mail
# itself. Contact and newsletter mail go through graphicmeat.com's partner API,
# which holds the only Purelymail credentials. Those five repo secrets can be
# deleted — SMTP_PASS especially, it was exposed by a world-readable .env.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync static files (excluding api/)
        run: |
          rsync -avz --delete \
            --exclude='api/' \
            --exclude='*.db' \
            --exclude='*.db-shm' \
            --exclude='*.db-wal' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./website/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/mailvaultapp/

      - name: Rsync API source (excluding node_modules, .env, data.db)
        run: |
          rsync -avz --delete \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='data.db' \
            --exclude='data.db-shm' \
            --exclude='data.db-wal' \
            --exclude='analytics.db' \
            --exclude='analytics.db-shm' \
            --exclude='analytics.db-wal' \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./website/api/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/mailvault-api/

      - name: Write CI-managed secrets.env atomically
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_MONTHLY_EUR: ${{ secrets.STRIPE_PRICE_MONTHLY_EUR }}
          STRIPE_PRICE_YEARLY_EUR: ${{ secrets.STRIPE_PRICE_YEARLY_EUR }}
          # No SMTP_* here on purpose: this site sends no mail of its own.
          # Contact and newsletter mail go through graphicmeat.com's partner API,
          # which holds the only Purelymail credentials.
          GRAPHICMEAT_PARTNER_URL: ${{ secrets.GRAPHICMEAT_PARTNER_URL }}
          GRAPHICMEAT_PARTNER_KEY: ${{ secrets.GRAPHICMEAT_PARTNER_KEY }}
          IP_SALT: ${{ secrets.IP_SALT }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          # Guards /api/metrics/summary; endpoint 404s while unset.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
          GRAPHICMEAT_ANALYTICS_URL: ${{ secrets.GRAPHICMEAT_ANALYTICS_URL }}
          GRAPHICMEAT_ANALYTICS_KEY: ${{ secrets.GRAPHICMEAT_ANALYTICS_KEY }}
        run: |
          # Build secrets file locally so we don't leak via shell history on server
          cat > /tmp/secrets.env <<EOF
          # CI-managed — overwritten by GitHub Actions on every deploy
          # DO NOT edit by hand
          CORS_ORIGIN=https://mailvaultapp.com,tauri://localhost,http://tauri.localhost,http://localhost:1420
          IP_SALT=${IP_SALT}
          ADMIN_KEY=${ADMIN_KEY}
          METRICS_TOKEN=${METRICS_TOKEN}
          ANALYTICS_API_KEY=${ANALYTICS_API_KEY}
          GRAPHICMEAT_ANALYTICS_URL=${GRAPHICMEAT_ANALYTICS_URL}
          GRAPHICMEAT_ANALYTICS_KEY=${GRAPHICMEAT_ANALYTICS_KEY}
          GRAPHICMEAT_PARTNER_URL=${GRAPHICMEAT_PARTNER_URL}
          GRAPHICMEAT_PARTNER_KEY=${GRAPHICMEAT_PARTNER_KEY}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
          STRIPE_PRICE_MONTHLY_EUR=${STRIPE_PRICE_MONTHLY_EUR}
          STRIPE_PRICE_YEARLY_EUR=${STRIPE_PRICE_YEARLY_EUR}
          EOF
          chmod 600 /tmp/secrets.env

          # scp to server, install with correct perms
          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            /tmp/secrets.env \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/secrets.env.new

          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'install -m 640 -o root -g mailvault /tmp/secrets.env.new /etc/mailvault-api/secrets.env && rm -f /tmp/secrets.env.new'

          rm -f /tmp/secrets.env

      - name: Ensure Caddy routes meatlytics paths to the API
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s <<'SCRIPT'
          set -e
          CF=/etc/caddy/Caddyfile
          # Idempotent: the mailvaultapp block only proxies /api/*; meatlytics
          # paths must reach the Node app too, ahead of the static catch-all.
          # /gm/* (not enumerated subpaths) so new assets like /gm/world.svg
          # don't fall through to the static index.html catch-all.
          grep -qF '@gm path /gm.js /gm-overlay.js /gm/*' "$CF" && exit 0
          cp "$CF" "$CF.bak-$(date +%Y%m%d-%H%M%S)"
          awk '
            /^[[:space:]]*@gm path / {
              print "    @gm path /gm.js /gm-overlay.js /gm/* /_analytics /_analytics/*"
              matched=1
              next
            }
            /handle \/api\/\* \{/ && !matched && !done {
              print "    @gm path /gm.js /gm-overlay.js /gm/* /_analytics /_analytics/*"
              print "    handle @gm {"
              print "        reverse_proxy 127.0.0.1:3001 {"
              print "            header_up X-Real-IP {remote}"
              print "        }"
              print "    }"
              done=1
            }
            { print }' "$CF" > /tmp/Caddyfile.new
          caddy validate --config /tmp/Caddyfile.new --adapter caddyfile
          install -m 644 /tmp/Caddyfile.new "$CF"
          rm -f /tmp/Caddyfile.new
          systemctl reload caddy
          SCRIPT

      - name: Install deps + restart service
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'set -e
             cd /opt/mailvault-api
             chown -R mailvault:mailvault /opt/mailvault-api
             # Only npm ci if package-lock changed (faster deploys)
             npm ci --omit=dev
             systemctl restart mailvault-api
             sleep 3
             systemctl is-active mailvault-api
             # Smoke test
             curl -sS -f --max-time 10 http://127.0.0.1:3001/api/health | head -1'

      - name: Verify via Cloudflare (public)
        run: |
          curl -sS -f --max-time 15 https://mailvaultapp.com/api/health
          curl -sS -f --max-time 15 -o /dev/null -w "homepage: %{http_code}\n" https://mailvaultapp.com/

      - name: Verify both subscription prices are sellable
        run: |
          # STRIPE_PRICE_*_EUR once pointed at another Stripe account: checkout 500'd with
          # "No such price" for weeks while health, pricing and this workflow stayed green.
          # /api/health prices is the server's boot-time stripe.prices.retrieve of BOTH ids.
          for i in 1 2 3 4 5; do
            prices=$(curl -sS --max-time 15 https://mailvaultapp.com/api/health | jq -r '.prices')
            [ "$prices" = "null" ] || break   # null = boot check still in flight
            sleep 3
          done
          if [ "$prices" != "true" ]; then
            echo "::error::Stripe price IDs are not usable by STRIPE_SECRET_KEY (health prices=$prices). Check STRIPE_PRICE_MONTHLY_EUR / STRIPE_PRICE_YEARLY_EUR against the key's Stripe account."
            exit 1
          fi

          # And the plans the app actually renders — both intervals must come back.
          plans=$(curl -sS -f --max-time 15 'https://mailvaultapp.com/api/billing/pricing?currency=EUR&country=LT')
          echo "$plans"
          for plan in monthly yearly; do
            echo "$plans" | jq -e --arg p "$plan" '.plans[] | select(.planId == $p) | .formattedAmount' > /dev/null \
              || { echo "::error::pricing endpoint returned no $plan plan"; exit 1; }
          done

          # End-to-end: actually create a session for both products. This is the call that
          # failed for weeks; health and pricing alone never touched it.
          # ALWAYS this address — every distinct email mints a permanent Stripe customer
          # plus a billing_customers row, so a fixed probe keeps that to exactly one
          # (cus_V0eMOTms28hpiN) instead of one per deploy. It owns no subscription.
          PROBE_EMAIL=probe-nonexistent-9f2a@example.com
          for plan in monthly yearly; do
            body=$(curl -sS --max-time 20 -X POST https://mailvaultapp.com/api/billing/checkout-session \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$PROBE_EMAIL\",\"planId\":\"$plan\"}")
            url=$(echo "$body" | jq -r '.url // empty')
            case "$url" in
              https://checkout.stripe.com/*) echo "$plan checkout: ok" ;;
              *) echo "::error::$plan checkout failed: $(echo "$body" | jq -c '{error, code}')"; exit 1 ;;
            esac
          done

      - name: Verify checkout self-heals a poisoned customer row
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          # 2026-08-08: rows minted while the Stripe secrets pointed at another
          # account held customer ids the live key doesn't know ("No such
          # customer"), silently blocking checkout for those emails. The pinned
          # probe above can't see that failure mode — its row is healthy. This
          # probe plants a poisoned row (DB name on the box: mailvault_website)
          # and requires checkout to heal it end-to-end, then leaves no residue.
          HEAL_EMAIL=heal-probe-c4d1@example.com
          POISON=cus_000healprobe000
          run_sql() {
            ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "mysql -N -e \"$1\""
          }

          run_sql "DELETE FROM mailvault_website.billing_customers WHERE email='$HEAL_EMAIL'"
          run_sql "INSERT INTO mailvault_website.billing_customers (email, stripe_customer_id) VALUES ('$HEAL_EMAIL', '$POISON')"

          body=$(curl -sS --max-time 25 -X POST https://mailvaultapp.com/api/billing/checkout-session \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$HEAL_EMAIL\",\"planId\":\"monthly\"}")
          url=$(echo "$body" | jq -r '.url // empty')
          healed=$(echo "$body" | jq -r '.customerId // empty')
          case "$url" in
            https://checkout.stripe.com/*) : ;;
            *) echo "::error::heal probe: checkout did not recover from a poisoned customer row: $(echo "$body" | jq -c '{error, code}')"; exit 1 ;;
          esac
          if [ -z "$healed" ] || [ "$healed" = "$POISON" ]; then
            echo "::error::heal probe: customer row was not repointed (customerId=$healed)"
            exit 1
          fi

          row=$(run_sql "SELECT stripe_customer_id FROM mailvault_website.billing_customers WHERE email='$HEAL_EMAIL'")
          if [ "$row" != "$healed" ]; then
            echo "::error::heal probe: DB row ($row) does not match healed customer ($healed)"
            exit 1
          fi
          echo "heal probe: $POISON -> $healed"

          # No residue: drop the minted Stripe customer and the probe row.
          curl -sS -X DELETE "https://api.stripe.com/v1/customers/$healed" -u "$STRIPE_SECRET_KEY:" > /dev/null
          run_sql "DELETE FROM mailvault_website.billing_customers WHERE email='$HEAL_EMAIL'"

      - name: Clean up SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
