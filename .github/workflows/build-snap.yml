name: Build Snap

on:
  workflow_call:
    inputs:
      arch:
        description: 'x86_64 or aarch64'
        required: true
        type: string

jobs:
  build-snap:
    permissions:
      contents: read
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 90
    env:
      TAURI_TARGET: ${{ inputs.arch }}-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libfuse2 \
            squashfs-tools

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ inputs.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-${{ inputs.arch }}-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build daemon sidecar
        run: npm run build:daemon

      - name: Build Tauri binary
        run: npx tauri build --target "$TAURI_TARGET" --no-bundle

      - name: Prepare snap staging
        run: bash scripts/build-snap-staging.sh

      - name: Install snapcraft and GNOME extension snaps
        run: |
          sudo snap install snapcraft --classic
          sudo snap install gnome-42-2204 gnome-42-2204-sdk gtk-common-themes

      - name: Build snap
        run: snapcraft --destructive-mode

      # Mesa must come only from gnome-42-2204: a bundled libEGL next to the
      # content snap's DRI drivers kills the app at launch (issue #16).
      - name: Check the snap bundles no Mesa
        run: |
          if unsquashfs -l ./*.snap | grep -E '/(libEGL_mesa|libGLX_mesa|libgbm|libglapi)\.so|/dri/[^/]+_dri\.so$'; then
            echo "::error::The snap bundles Mesa libraries that gnome-42-2204 already provides"
            exit 1
          fi

      - name: Upload snap artifact
        uses: actions/upload-artifact@v6
        with:
          name: snap-${{ inputs.arch }}-artifact
          path: "*.snap"
          retention-days: 1
