name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        description: 'Override the app version before building (e.g. 2.11.3-nightly.abc1234). Empty = use the repo version.'
        required: false
        type: string
        default: ''

jobs:
  build-windows:
    # The `release` environment (main only) is what the Azure federated
    # credential trusts, so this job can sign and a branch run cannot.
    environment: release
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-x86_64-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Stamp version override
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/stamp-version.sh "$VERSION"

      - name: Build daemon sidecar
        run: npm run build:daemon

      # Compile first, bundle (and sign) later: the Azure login sits right
      # before the bundle step so its short-lived OIDC token is still valid
      # when signtool asks for it, not consumed by a cold compile.
      - name: Build Windows app
        run: |
          rm -rf target/release/bundle
          npx tauri build --no-bundle

      - name: Prepare Artifact Signing
        shell: pwsh
        run: ./scripts/windows-sign-setup.ps1

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The signer role sits on the signing account, not the subscription.
          allow-no-subscriptions: true

      - name: Check signing works
        shell: pwsh
        run: |
          Copy-Item 'src-tauri\binaries\mailvault-daemon-x86_64-pc-windows-msvc.exe' "$env:RUNNER_TEMP\sign-probe.exe"
          ./scripts/windows-sign-probe.ps1 -File "$env:RUNNER_TEMP\sign-probe.exe"

      - name: Bundle and sign NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri bundle --bundles nsis --config "$SIGN_CONFIG"

      # A signCommand that silently did not apply still leaves a green build,
      # so prove the installer carries our publisher before shipping it.
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installers = Get-ChildItem 'target\release\bundle\nsis\*-setup.exe'
          if (-not $installers) { throw 'no NSIS installer was built' }
          foreach ($f in $installers) {
            $out = & $env:SIGNTOOL verify /pa /v $f.FullName | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0 -or $out -notmatch 'MODERNIOS APLIKACIJOS') {
              throw "$($f.Name) is not signed by MODERNIOS APLIKACIJOS"
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-x86_64-artifacts
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          retention-days: 1
