name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-core/**'
      - 'src-daemon/**'
      - 'src-mock-imap/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.lock'
      - 'vite.config.*'
      - 'vitest.config.*'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-core/**'
      - 'src-daemon/**'
      - 'src-mock-imap/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.lock'
      - 'vite.config.*'
      - 'vitest.config.*'
      - '.github/workflows/ci.yml'
jobs:
  unit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check version consistency
        run: bash scripts/check-version-consistency.sh
      # Hermetic — no network, no credentials.
      - run: npm test

  # IMAP client behavior against the scriptable mock server. Deterministic and
  # offline — this is the suite that gates every push.
  imap-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-imap-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-imap-
      # mailvault-daemon pulls keyring -> libdbus-sys (sync-secret-service on
      # Linux), which needs dbus headers at build time even though no test
      # touches the keychain.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libsecret-1-dev libglib2.0-dev
      - run: cargo test -p mailvault-core -p mailvault-daemon -p mock-imap
      # JS integration suite drives the same mock server through imapflow — an
      # independent client implementation cross-checking the mock. Replaced the
      # credential-gated live-conformance workflow.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-22.04
    needs: unit-integration
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-e2e-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libglib2.0-dev libdbus-1-dev \
            libsecret-1-dev patchelf xvfb dbus
      - run: npm ci
      - name: Build Vite frontend
        run: npx vite build
      - name: Create stub external binary for Linux build
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/mailvault-daemon-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/mailvault-daemon-x86_64-unknown-linux-gnu
      - name: Build Tauri debug binary with WebDriver feature
        run: cd src-tauri && cargo build --features webdriver
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Install tauri-wd
        run: cargo install tauri-webdriver-automation --locked --force
      - name: Create empty .env.test for UI-only suite
        run: touch .env.test
      - name: Run E2E tests (ui-headless suite)
        env:
          TAURI_APP_BINARY: ${{ github.workspace }}/target/debug/mailvault
          CI: "true"
          # Fixed app HOME so the log-dump step below can find app/daemon logs.
          E2E_DATA_DIR: ${{ runner.temp }}/e2e-home
          # Defensive: Tauri's documented CI setting for GPU-less runners.
          # Probing showed the webview renders fine either way on today's
          # runner image, but the software path is the stable one to pin.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          # No a11y bus in CI — skip the AT-SPI bridge instead of probing for it.
          NO_AT_BRIDGE: "1"
        run: |
          mkdir -p "$E2E_DATA_DIR"
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx wdio run wdio.conf.js --suite ui-headless
      - name: Dump app/daemon logs
        if: always()
        run: |
          echo "=== e2e-home tree ==="
          find "$RUNNER_TEMP/e2e-home" -maxdepth 5 | head -80
          # Dated rotation: mailvault.log.2026-08-03 — match *.log* not *.log
          find "$RUNNER_TEMP/e2e-home" -name "*.log*" -type f | while read -r f; do
            echo "=== $f ==="; tail -n 300 "$f"
          done
          for f in accounts.json frontend-settings.json; do
            p="$RUNNER_TEMP/e2e-home/.local/share/com.mailvault.app/$f"
            [ -f "$p" ] && { echo "=== $f ==="; cat "$p"; } || true
          done
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-home/*.png
          if-no-files-found: ignore
