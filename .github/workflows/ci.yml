name: CI

# Main is tested once a night, not on every push (Actions minutes), and only
# when a tested path changed since the last scheduled or manual run (the gate
# job). PRs run on every push. A running build is never cancelled on main; PRs:
# a new push makes the old build worthless, cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  schedule:
    # 21:17 UTC: ends well before the 23:47 UTC nightly build. An odd minute
    # dodges the top-of-the-hour queue (see nightly.yml).
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Test even if no tested path changed since the last run'
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-core/**'
      - 'src-daemon/**'
      - 'src-mock-imap/**'
      - 'src-render/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vite.config.*'
      - 'vitest.config.*'
      - 'scripts/check-blitz-removal.sh'
      - '.github/workflows/ci.yml'
jobs:
  # Scheduled and manual runs test main only when a tested path changed since
  # the last such run (whatever its result, so a red commit is not retried every
  # night; cancelled runs do not count). Keep PATHS in sync with the
  # pull_request filter above.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare HEAD with the last tested commit
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PATHS=(src src-core src-daemon src-mock-imap src-render src-tauri tests
            package.json package-lock.json Cargo.toml Cargo.lock
            ':(glob)vite.config.*' ':(glob)vitest.config.*'
            scripts/check-blitz-removal.sh .github/workflows/ci.yml)
          if [ "$EVENT" = "pull_request" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST=$(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" --limit 50 \
            --json databaseId,headSha,event,conclusion \
            --jq "[.[] | select(.event != \"pull_request\" and (.conclusion == \"success\" or .conclusion == \"failure\") and .databaseId != $GITHUB_RUN_ID)][0].headSha // \"\"")
          if [ -n "$LAST" ] && git cat-file -e "${LAST}^{commit}" 2>/dev/null \
             && git diff --quiet "$LAST" "$GITHUB_SHA" -- "${PATHS[@]}"; then
            echo "No tested path changed since ${LAST}; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last tested: ${LAST:-none}; HEAD: ${GITHUB_SHA}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  unit-integration:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check version consistency
        run: bash scripts/check-version-consistency.sh
      - run: node scripts/build-search-index.mjs website
      # Hermetic — no network, no credentials.
      - run: npm test

  # IMAP client behavior against the scriptable mock server. Deterministic and
  # offline — this is the suite that gates every push.
  imap-mock:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-imap-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-imap-
      # mailvault-core pulls async-native-tls, which on Linux binds the system
      # OpenSSL through pkg-config. mailvault-daemon pulls keyring, which on
      # Linux binds libdbus/libsecret through pkg-config too (Phase 5 moved
      # keychain-backed credentials into the daemon). The daemon's default
      # blitz-render feature pulls mailvault-render, whose font discovery
      # (fontique) binds fontconfig through pkg-config; DejaVu gives the
      # daemon's render tests a face.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libfontconfig1-dev fonts-dejavu-core
      - run: cargo test -p imap-proto -p mailvault-core -p mailvault-daemon -p mock-imap
      # JS integration suite drives the same mock server through imapflow — an
      # independent client implementation cross-checking the mock. Replaced the
      # credential-gated live-conformance workflow.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:integration

  # Blitz email renderer crate. Font discovery (fontique) differs per OS, so
  # the crate's tests run on all three; the imap-mock job above is ubuntu-only.
  render-crate:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-render-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-render-${{ matrix.os }}-
      # fontique binds fontconfig on Linux; DejaVu gives font discovery a face.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev fonts-dejavu-core
      - run: cargo test -p mailvault-render

  # The Blitz renderer module must stay removable: delete it from a scratch copy
  # and build and test what is left (scripts/check-blitz-removal.sh). Needs the
  # same Tauri shell deps as the e2e job, since it runs `cargo check -p mailvault`.
  blitz-removable:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/blitz-removal
          key: rust-blitz-removal-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-blitz-removal-
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libglib2.0-dev libdbus-1-dev \
            libsecret-1-dev patchelf
      - run: npm ci
      - run: bash scripts/check-blitz-removal.sh

  e2e:
    runs-on: ubuntu-22.04
    needs: [gate, unit-integration]
    if: needs.gate.outputs.changed == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-e2e-
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libglib2.0-dev libdbus-1-dev \
            libsecret-1-dev patchelf xvfb dbus
      - run: npm ci
      - name: Build Vite frontend
        run: npx vite build
      - name: Build and stage the daemon sidecar
        run: |
          DAEMON_PROFILE=debug npm run build:daemon
          test -s src-tauri/binaries/mailvault-daemon-x86_64-unknown-linux-gnu
      - name: Build Tauri debug binary with WebDriver feature
        run: cd src-tauri && cargo build --features webdriver
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Install tauri-wd
        run: cargo install tauri-webdriver-automation --locked --force
      - name: Create empty .env.test for UI-only suite
        run: touch .env.test
      - name: Run E2E tests (ui-headless suite)
        env:
          TAURI_APP_BINARY: ${{ github.workspace }}/target/debug/mailvault
          CI: "true"
          # Fixed app HOME so the log-dump step below can find app/daemon logs.
          E2E_DATA_DIR: ${{ runner.temp }}/e2e-home
          # Defensive: Tauri's documented CI setting for GPU-less runners.
          # Probing showed the webview renders fine either way on today's
          # runner image, but the software path is the stable one to pin.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          # No a11y bus in CI — skip the AT-SPI bridge instead of probing for it.
          NO_AT_BRIDGE: "1"
        run: |
          mkdir -p "$E2E_DATA_DIR"
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx wdio run wdio.conf.js --suite ui-headless
      - name: Dump app/daemon logs
        if: always()
        run: |
          echo "=== e2e-home tree ==="
          find "$RUNNER_TEMP/e2e-home" -maxdepth 5 | head -80
          # Dated rotation: mailvault.log.2026-08-03 — match *.log* not *.log
          find "$RUNNER_TEMP/e2e-home" -name "*.log*" -type f | while read -r f; do
            echo "=== $f ==="; tail -n 300 "$f"
          done
          for f in accounts.json frontend-settings.json; do
            p="$RUNNER_TEMP/e2e-home/.local/share/com.mailvault.app/$f"
            [ -f "$p" ] && { echo "=== $f ==="; cat "$p"; } || true
          done
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-home/*.png
          if-no-files-found: ignore
