name: Windows Sign Check

# Two-minute proof that Azure Artifact Signing works from CI: OIDC login, role,
# certificate profile, dlib. Run it after changing anything on the Azure side
# instead of waiting on a full release build.
on:
  workflow_dispatch:

jobs:
  sign-check:
    # Same environment as build-windows: the federated credential trusts it.
    environment: release
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare Artifact Signing
        shell: pwsh
        run: ./scripts/windows-sign-setup.ps1

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Prints who CI signs as (claims only, never the token) so a 403 can be
      # matched against the Signer role assignment in the portal.
      - name: Show signing identity
        shell: pwsh
        run: |
          $jwt = az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv
          $p = $jwt.Split('.')[1].Replace('-', '+').Replace('_', '/')
          $p = $p.PadRight($p.Length + (4 - $p.Length % 4) % 4, '=')
          $c = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($p)) | ConvertFrom-Json
          Write-Host "tenant (tid):            $($c.tid)"
          Write-Host "app id (appid):          $($c.appid)"
          Write-Host "principal object (oid):  $($c.oid)"
          Write-Host "audience (aud):          $($c.aud)"
          Write-Host "roles in token:          $($c.roles -join ', ')"

      - name: Sign and verify a throwaway script
        shell: pwsh
        run: |
          $probe = "$env:RUNNER_TEMP\sign-probe.ps1"
          Set-Content -Path $probe -Value "Write-Output 'MailVault signing probe'"
          ./scripts/windows-sign-probe.ps1 -File $probe
