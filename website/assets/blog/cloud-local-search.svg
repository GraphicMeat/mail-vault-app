<svg xmlns="http://www.w3.org/2000/svg" width="640" height="804" viewBox="0 0 640 804" role="img" aria-labelledby="title desc">
<title id="title">Local retrieval and cloud AI answers</title><desc id="desc">Local retrieval searches a downloaded index on the computer. Cloud AI search processes a question remotely and returns an answer to verify against original messages.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4f46df"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#20212b}.title{font-size:30px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:23px;fill:#444653}.small{font-size:21px;fill:#444653}.accent{fill:#4f46df}.line{stroke:#4f46df;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="640" height="804" rx="14" fill="#faf9f6"/><text x="32" y="49" class="title">Where does the search happen?</text><text x="32" y="100" class="label">Local retrieval</text><text x="32" y="135" class="body">On your computer</text><rect x="32" y="163" width="576" height="128" rx="12" fill="#fff" stroke="#d5d4df"/><text x="56" y="200" class="label">Query + downloaded index</text><text x="56" y="234" class="body">Search the messages you have kept</text><text x="56" y="263" class="body">No remote AI required for full-text search</text><path d="M320 300V333" class="line" stroke="#4f46df" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="32" y="376" class="label">Matching messages → open the original</text><path d="M32 412H608" stroke="#d5d4df" stroke-width="2"/><text x="32" y="465" class="label">Cloud AI search</text><text x="32" y="500" class="body">At the service provider</text><rect x="32" y="528" width="576" height="128" rx="12" fill="#fff" stroke="#d5d4df"/><text x="56" y="565" class="label">Question + accessible mailbox content</text><text x="56" y="599" class="body">Remote processing returns an answer</text><text x="56" y="628" class="body">Availability and policies depend on the plan</text><path d="M320 664V697" class="line" stroke="#4f46df" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="32" y="740" class="label">AI answer → verify the source messages</text><text x="32" y="781" class="small">A desktop app can also use remote AI. Check settings.</text></svg>