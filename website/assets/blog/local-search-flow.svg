<svg xmlns="http://www.w3.org/2000/svg" width="640" height="890" viewBox="0 0 640 890" role="img" aria-labelledby="title desc">
<title id="title">How MailVault local search works</title><desc id="desc">Downloaded messages supply a local SQLite index. A query searches the index to build results; opening a saved result reads the original message.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4f46df"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#20212b}.title{font-size:30px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:23px;fill:#444653}.small{font-size:21px;fill:#444653}.accent{fill:#4f46df}.line{stroke:#4f46df;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="640" height="890" rx="14" fill="#faf9f6"/><text x="32" y="49" class="title">Your mail → your index → your results</text><text x="32" y="83" class="small">A simplified view of ordinary local search</text><rect x="32" y="112" width="576" height="128" rx="12" fill="#fff" stroke="#d5d4df"/><text x="56" y="149" class="label">1. Keep the original messages</text><text x="56" y="183" class="body">Saved .eml files on your disk</text><text x="56" y="212" class="body">Coverage depends on your download mode</text><path d="M320 248V282" class="line" stroke="#4f46df" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="339" y="273" class="small">Index message content</text><rect x="32" y="294" width="576" height="128" rx="12" fill="#fff" stroke="#d5d4df"/><text x="56" y="331" class="label">2. Build a local search index</text><text x="56" y="365" class="body">SQLite FTS5 stores searchable text</text><text x="56" y="394" class="body">The saved files remain the source of truth</text><path d="M320 430V464" class="line" stroke="#4f46df" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="339" y="455" class="small">You enter a query</text><rect x="32" y="476" width="576" height="128" rx="12" fill="#fff" stroke="#d5d4df"/><text x="56" y="513" class="label">3. Retrieve matching results</text><text x="56" y="547" class="body">Match indexed text and apply filters</text><text x="56" y="576" class="body">Build the list from indexed metadata</text><path d="M320 612V646" class="line" stroke="#4f46df" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="339" y="637" class="small">You open a result</text><rect x="32" y="658" width="576" height="128" rx="12" fill="#fff" stroke="#d5d4df"/><text x="56" y="695" class="label">4. Read the original email</text><text x="56" y="729" class="body">Open the saved message and attachments</text><text x="56" y="758" class="body">Check the source before making a decision</text><text x="32" y="830" class="label">Local retrieval can work offline.</text><text x="32" y="863" class="small">Mail never downloaded cannot be read offline.</text></svg>