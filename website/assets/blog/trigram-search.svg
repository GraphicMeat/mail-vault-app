<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="title desc">
<title id="title">How trigram matching finds part of a word</title><desc id="desc">The word invoice is split into overlapping three-letter pieces: inv, nvo, voi, oic, ice. The query voic overlaps voi and oic, allowing a substring match.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4f46df"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#20212b}.title{font-size:30px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:23px;fill:#444653}.small{font-size:21px;fill:#444653}.accent{fill:#4f46df}.line{stroke:#4f46df;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="640" height="470" rx="14" fill="#faf9f6"/><text x="32" y="49" class="title">How “voic” can find “invoice”</text><text x="32" y="99" class="small">A simplified trigram example</text><text x="32" y="157" class="label">Indexed word: invoice</text><rect x="32" y="187" width="104" height="60" rx="8" fill="#eeecff"/><text x="54" y="225" class="label">inv</text><rect x="148" y="187" width="104" height="60" rx="8" fill="#eeecff"/><text x="170" y="225" class="label">nvo</text><rect x="264" y="187" width="104" height="60" rx="8" fill="#eeecff"/><text x="286" y="225" class="label">voi</text><rect x="380" y="187" width="104" height="60" rx="8" fill="#eeecff"/><text x="402" y="225" class="label">oic</text><rect x="496" y="187" width="104" height="60" rx="8" fill="#eeecff"/><text x="518" y="225" class="label">ice</text><text x="32" y="294" class="label">Query: voic → voi + oic</text><text x="32" y="337" class="body">Both pieces occur in “invoice”.</text><text x="32" y="396" class="body">FTS5 matches the pieces in order.</text><text x="32" y="434" class="body">The index returns matching messages.</text></svg>