    {
      "@type": "Question",
      "name": "Funktioniert MailVault mit Gmail und Outlook?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. MailVault works with Gmail, Outlook, JMAP servers such as Fastmail, and any email service that supports IMAP. For Gmail, sign in directly with your Google account using OAuth2 — no manual IMAP settings needed. Microsoft 365 Business and Enterprise accounts can sign in directly with your Microsoft account using OAuth2. Outlook.com, Hotmail and Live.com accounts connect over IMAP with Microsoft sign-in by default, or through the Microsoft Graph API if you choose it."
      }
    },
    {
      "@type": "Question",
      "name": "Wie verbinde ich mein Outlook.com-Konto?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "MailVault verbindet Konten bei Outlook.com, Hotmail und Live.com standardmäßig über IMAP mit der OAuth2-Anmeldung von Microsoft. Füge das Konto hinzu, wähle „Mit Microsoft anmelden“ und schließe die Anmeldung in deinem Browser ab. Du gibst kein Passwort und keinen Server ein. Outlook.com akzeptiert IMAP erst, wenn in den Einstellungen Geräten und Apps die Verwendung von IMAP erlauben eingeschaltet ist, wie unter MailVault meldet, Outlook habe IMAP abgelehnt beschrieben. Die Schritte stehen unter Wie füge ich ein Outlook.com- oder Hotmail-Konto über IMAP hinzu? Die Microsoft-Graph-API steht weiterhin zur Verfügung. Wähle beim Hinzufügen des Kontos unter Verbinden über die Option Microsoft Graph oder wechsle später unter Einstellungen → Konten → Verbindung. Graph braucht in Outlook.com nichts eingerichtet, und Lesen, Löschen, Verschieben, Markieren als gelesen oder ungelesen und Sichern funktionieren wie bei anderen Konten. Bei Graph-Konten nicht verfügbar: Zurückstellen; Eine MBOX-Datei auf dem Server wiederherstellen; Auf dem Server wiederherstellen für gelöschte E-Mails. Lokal wiederherstellen funktioniert für E-Mails, die schon auf diesem Computer liegen; Die Anzahl im Posteingang, die das Fenster zum Hinzufügen eines Kontos nach dem Verbindungstest meldet. Konten über IMAP sind von diesen Einschränkungen nicht betroffen, ebenso wenig Microsoft-365-Konten für Beruf oder Schule, die ebenfalls IMAP mit OAuth2 nutzen. Diese Anmeldung folgt demselben Ansatz wie Mozilla Thunderbird, mit PKCE und XOAUTH2-Authentifizierung."
