      "@type": "Question",
      "name": "MailVault fonctionne-t-il avec Gmail et Outlook ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. MailVault works with Gmail, Outlook, JMAP servers such as Fastmail, and any email service that supports IMAP. For Gmail, sign in directly with your Google account using OAuth2 — no manual IMAP settings needed. Microsoft 365 Business and Enterprise accounts can sign in directly with your Microsoft account using OAuth2. Outlook.com, Hotmail and Live.com accounts connect over IMAP with Microsoft sign-in by default, or through the Microsoft Graph API if you choose it."
      }
    },
    {
      "@type": "Question",
      "name": "Comment connecter mon compte Outlook.com ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "MailVault connecte par défaut les comptes Outlook.com, Hotmail et Live.com en IMAP, avec la connexion OAuth2 de Microsoft. Ajoutez le compte, choisissez Connectez-vous avec Microsoft et terminez la connexion dans votre navigateur. Il n’y a ni mot de passe à saisir ni serveur à indiquer. Outlook.com n’accepte IMAP que lorsque Autoriser les appareils et les applications à utiliser IMAP est activé dans ses paramètres, comme décrit dans MailVault indique qu’Outlook a refusé IMAP. Les étapes figurent dans Comment ajouter un compte Outlook.com ou Hotmail en IMAP ? L’API Microsoft Graph reste disponible. Choisissez Microsoft Graph sous Se connecter via quand vous ajoutez le compte, ou changez plus tard dans Réglages → Comptes → Connexion. Graph ne demande rien de configuré dans Outlook.com, et la lecture, la suppression, le marquage comme lu ou non lu, le déplacement et la sauvegarde des e-mails fonctionnent comme sur les autres comptes. Non disponible sur les comptes Graph : Reporter ; Restaurer un fichier MBOX sur le serveur ; Récupérer sur le serveur pour les e-mails supprimés. Récupérer en local fonctionne, pour le courrier déjà présent sur cet ordinateur ; Le nombre de messages de la boîte de réception que la fenêtre d'ajout de compte indique après le test de connexion. Les comptes en IMAP ne sont pas concernés par ces limites, pas plus que les comptes professionnels ou scolaires Microsoft 365, qui utilisent aussi IMAP avec OAuth2. Cette connexion suit la même approche que Mozilla Thunderbird, avec PKCE et l’authentification XOAUTH2."
