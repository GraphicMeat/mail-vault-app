      "name": "O MailVault funciona com Gmail e Outlook?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. MailVault works with Gmail, Outlook, JMAP servers such as Fastmail, and any email service that supports IMAP. For Gmail, sign in directly with your Google account using OAuth2 — no manual IMAP settings needed. Microsoft 365 Business and Enterprise accounts can sign in directly with your Microsoft account using OAuth2. Outlook.com, Hotmail and Live.com accounts connect over IMAP with Microsoft sign-in by default, or through the Microsoft Graph API if you choose it."
      }

    {
      "@type": "Question",
      "name": "Como conecto minha conta do Outlook.com?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "O MailVault conecta contas do Outlook.com, Hotmail e Live.com por IMAP por padrão, com o login OAuth2 da Microsoft. Adicione a conta, escolha Entrar com a Microsoft e conclua o login no navegador. Não há senha para digitar nem servidor para informar. O Outlook.com só aceita IMAP depois que Permitir que dispositivos e aplicativos usem IMAP é ativado nas configurações dele, como descrito em O MailVault diz que o Outlook recusou o IMAP. Os passos estão em Como adiciono uma conta do Outlook.com ou Hotmail por IMAP? A API Microsoft Graph continua disponível. Escolha Microsoft Graph em Conectar via ao adicionar a conta, ou troque depois em Configurações → Contas → Conexão. O Graph não precisa de nada configurado no Outlook.com, e ler, excluir, marcar como lido ou não lido, mover e fazer backup do e-mail funcionam como nas outras contas. Indisponível em contas no Graph: Adiar; Restaurar um arquivo MBOX no servidor; Recuperar no servidor para e-mails excluídos. Recuperar localmente funciona, para e-mails que já estão neste computador; A contagem da Caixa de entrada que a janela de adicionar conta informa depois do teste de conexão. Contas em IMAP não são afetadas por esses limites, nem as contas Microsoft 365 de trabalho ou escola, que também usam IMAP com OAuth2. Esse login segue a mesma abordagem do Mozilla Thunderbird, com PKCE e autenticação XOAUTH2."
