      "name": "¿MailVault funciona con Gmail y Outlook?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. MailVault works with Gmail, Outlook, JMAP servers such as Fastmail, and any email service that supports IMAP. For Gmail, sign in directly with your Google account using OAuth2 — no manual IMAP settings needed. Microsoft 365 Business and Enterprise accounts can sign in directly with your Microsoft account using OAuth2. Outlook.com, Hotmail and Live.com accounts connect over IMAP with Microsoft sign-in by default, or through the Microsoft Graph API if you choose it."
      }

    {
      "@type": "Question",
      "name": "¿Cómo conecto mi cuenta de Outlook.com?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "MailVault conecta las cuentas de Outlook.com, Hotmail y Live.com por IMAP de forma predeterminada, con el inicio de sesión OAuth2 de Microsoft. Añade la cuenta, elige Iniciar sesión con Microsoft y completa el inicio de sesión en tu navegador. No hay contraseña que introducir ni servidor que escribir. Outlook.com solo acepta IMAP cuando está activado Permitir que los dispositivos y las aplicaciones usen IMAP en sus ajustes, como se explica en MailVault dice que Outlook rechazó IMAP. Los pasos están en ¿Cómo añado una cuenta de Outlook.com o Hotmail por IMAP? La API Microsoft Graph sigue disponible. Elige Microsoft Graph en Conectar mediante al añadir la cuenta, o cambia más tarde en Ajustes → Cuentas → Conexión. Graph no necesita nada configurado en Outlook.com, y leer, eliminar, marcar como leído o no leído, mover y respaldar el correo funcionan igual que en otras cuentas. No disponible en cuentas de Graph: Posponer; Restaurar un archivo MBOX en el servidor; Recuperar en el servidor para los correos eliminados. Recuperar en local sí funciona, para el correo que ya está en este ordenador; El recuento de la bandeja de entrada que muestra la ventana de añadir cuenta tras la prueba de conexión. Las cuentas en IMAP no se ven afectadas por estos límites, ni tampoco las cuentas de trabajo o centro educativo de Microsoft 365, que también usan IMAP con OAuth2. Ese inicio de sesión sigue el mismo enfoque que Mozilla Thunderbird, con autenticación PKCE y XOAUTH2."
