      "@type": "Question",
      "name": "MailVaultはGmailやOutlookで使えますか？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. MailVault works with Gmail, Outlook, JMAP servers such as Fastmail, and any email service that supports IMAP. For Gmail, sign in directly with your Google account using OAuth2 — no manual IMAP settings needed. Microsoft 365 Business and Enterprise accounts can sign in directly with your Microsoft account using OAuth2. Outlook.com, Hotmail and Live.com accounts connect over IMAP with Microsoft sign-in by default, or through the Microsoft Graph API if you choose it."
      }
    },
    {
      "@type": "Question",
      "name": "Outlook.com のアカウントを接続するには？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "MailVault は、Outlook.com、Hotmail、Live.com のアカウントを、既定で Microsoft の OAuth2 サインインを使った IMAP で接続します。アカウントを追加し、Microsoft アカウントでサインインを選び、ブラウザーでサインインを完了してください。パスワードもサーバーも入力する必要はありません。Outlook.com は、設定でデバイスとアプリで IMAP を使用できるようにするをオンにしないと IMAP を受け付けません。詳しくはOutlook が IMAP を拒否したと MailVault に表示されますをご覧ください。手順はOutlook.com や Hotmail のアカウントを IMAP で追加するには？にあります。 Microsoft Graph API も引き続き使えます。アカウントを追加するときに接続方法でMicrosoft Graphを選ぶか、あとから設定 → アカウント → 接続で切り替えてください。Graph は Outlook.com 側での設定が不要で、メールの読み取り、削除、既読・未読のマーク、移動、バックアップは、ほかのアカウントと同じように動作します。 Graph アカウントでは使えないもの: スヌーズ。MBOX ファイルをサーバーに復元すること。削除したメールのサーバーに復元。ローカルに復元は、すでにこのコンピュータにあるメールに対して使えます。接続テストの後にアカウント追加ウインドウが表示する受信トレイの件数。IMAP を使うアカウントにはこれらの制限は当てはまりません。同じく IMAP と OAuth2 を使う Microsoft 365 の職場・学校アカウントも同様です。このサインインは、PKCE と XOAUTH2 認証を使う点で、Mozilla Thunderbird と同じ方式です。"
