      "name": "MailVault funziona con Gmail e Outlook?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. MailVault works with Gmail, Outlook, JMAP servers such as Fastmail, and any email service that supports IMAP. For Gmail, sign in directly with your Google account using OAuth2 — no manual IMAP settings needed. Microsoft 365 Business and Enterprise accounts can sign in directly with your Microsoft account using OAuth2. Outlook.com, Hotmail and Live.com accounts connect over IMAP with Microsoft sign-in by default, or through the Microsoft Graph API if you choose it."
      }

    {
      "@type": "Question",
      "name": "Come collego il mio account Outlook.com?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "MailVault collega gli account Outlook.com, Hotmail e Live.com tramite IMAP per impostazione predefinita, con l’accesso OAuth2 di Microsoft. Aggiungi l’account, scegli Accedi con Microsoft e completa l’accesso nel browser. Non c’è alcuna password da inserire né alcun server da digitare. Outlook.com accetta IMAP solo quando nelle sue impostazioni è attivato Consenti a dispositivi e app di usare IMAP, come descritto in MailVault dice che Outlook ha rifiutato IMAP. I passaggi sono in Come aggiungo un account Outlook.com o Hotmail tramite IMAP? L’API Microsoft Graph è ancora disponibile. Scegli Microsoft Graph in Connetti tramite quando aggiungi l’account, oppure cambia più tardi in Impostazioni → Account → Connessione. Graph non richiede nulla in Outlook.com, e lettura, eliminazione, contrassegno come letto o non letto, spostamento e backup funzionano come sugli altri account. Non disponibile sugli account Graph: Posticipa; Ripristino di un file MBOX sul server; Recupera sul server per le email eliminate. Recupera in locale funziona, per la posta già presente su questo computer; Il conteggio della Posta in arrivo che la finestra di aggiunta account riporta dopo il test di connessione. Gli account su IMAP non sono interessati da questi limiti, e nemmeno gli account di lavoro o scuola Microsoft 365, che usano anch’essi IMAP con OAuth2. Quell’accesso segue lo stesso approccio di Mozilla Thunderbird, con PKCE e autenticazione XOAUTH2."
