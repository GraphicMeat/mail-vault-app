      "@type": "Question",
      "name": "MailVault 支持 Gmail 和 Outlook 吗？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. MailVault works with Gmail, Outlook, JMAP servers such as Fastmail, and any email service that supports IMAP. For Gmail, sign in directly with your Google account using OAuth2 — no manual IMAP settings needed. Microsoft 365 Business and Enterprise accounts can sign in directly with your Microsoft account using OAuth2. Outlook.com, Hotmail and Live.com accounts connect over IMAP with Microsoft sign-in by default, or through the Microsoft Graph API if you choose it."
      }
    },
    {
      "@type": "Question",
      "name": "如何连接我的 Outlook.com 账户？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "MailVault 默认通过 IMAP 和 Microsoft 的 OAuth2 登录连接 Outlook.com、Hotmail 和 Live.com 账户。添加账户，选择使用 Microsoft 账户登录，然后在浏览器中完成登录。无需输入密码，也无需填写服务器。只有在 Outlook.com 的设置中打开允许设备和应用使用 IMAP 之后，它才会接受 IMAP，详见 MailVault 提示 Outlook 拒绝了 IMAP。具体步骤见如何通过 IMAP 添加 Outlook.com 或 Hotmail 账户？ Microsoft Graph API 仍然可用。添加账户时，在连接方式下选择 Microsoft Graph，或者之后在设置 → 账户 → 连接中切换。Graph 不需要在 Outlook.com 里设置任何东西，阅读、删除、标为已读或未读、移动和备份邮件都和其他账户一样可用。 Graph 账户不支持： 稍后提醒；把 MBOX 文件恢复到服务器；对已删除邮件使用恢复到服务器。「恢复到本地」可以使用，适用于已经在这台电脑上的邮件；添加账户窗口在连接测试后报告的收件箱数量。使用 IMAP 的账户不受这些限制影响，同样使用 IMAP 和 OAuth2 的 Microsoft 365 工作或学校账户也不受影响。这种登录方式与 Mozilla Thunderbird 的做法一致，采用 PKCE 和 XOAUTH2 认证。"
