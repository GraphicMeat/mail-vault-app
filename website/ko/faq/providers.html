      "@type": "Question",
      "name": "MailVault는 Gmail과 Outlook에서도 작동합니까?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. MailVault works with Gmail, Outlook, JMAP servers such as Fastmail, and any email service that supports IMAP. For Gmail, sign in directly with your Google account using OAuth2 — no manual IMAP settings needed. Microsoft 365 Business and Enterprise accounts can sign in directly with your Microsoft account using OAuth2. Outlook.com, Hotmail and Live.com accounts connect over IMAP with Microsoft sign-in by default, or through the Microsoft Graph API if you choose it."
      }
    },
    {
      "@type": "Question",
      "name": "Outlook.com 계정은 어떻게 연결합니까?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "MailVault는 Outlook.com, Hotmail, Live.com 계정을 기본적으로 Microsoft의 OAuth2 로그인을 사용한 IMAP으로 연결합니다. 계정을 추가하고 Microsoft 계정으로 로그인을 선택한 뒤 브라우저에서 로그인을 마치세요. 입력할 비밀번호도, 직접 입력할 서버도 없습니다. Outlook.com은 설정에서 디바이스 및 앱에서 IMAP 사용 허용을 켜야만 IMAP을 받아들이며, 이는 MailVault에 Outlook이 IMAP을 거부했다고 나옵니다에 설명되어 있습니다. 단계는 IMAP으로 Outlook.com 또는 Hotmail 계정을 추가하려면 어떻게 하나요?에 있습니다. Microsoft Graph API도 여전히 사용할 수 있습니다. 계정을 추가할 때 연결 방식에서 Microsoft Graph를 선택하거나, 나중에 설정 → 계정 → 연결에서 전환하세요. Graph는 Outlook.com에서 따로 설정할 것이 없으며, 메일 읽기, 삭제, 읽음 또는 읽지 않음 표시, 이동, 백업은 다른 계정과 똑같이 작동합니다. Graph 계정에서 사용할 수 없는 기능: 다시 알림; MBOX 파일을 서버로 복원하기; 삭제한 메일의 서버로 복구. 이 컴퓨터에 이미 있는 메일이라면 로컬로 복구는 작동합니다. 연결 테스트 뒤 계정 추가 창이 알려 주는 받은편지함 메일 수. IMAP을 쓰는 계정은 이러한 제한의 영향을 받지 않으며, OAuth2와 함께 IMAP을 쓰는 Microsoft 365 직장 또는 학교 계정도 마찬가지입니다. 이 로그인은 PKCE와 XOAUTH2 인증을 사용하는 Mozilla Thunderbird와 같은 방식을 따릅니다."
