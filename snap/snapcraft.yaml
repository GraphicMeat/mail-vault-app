name: mailvault
version: '2.19.0'
summary: Privacy-first desktop email client with local Maildir storage
description: |
  MailVault is a desktop email client that stores your emails locally in
  standard Maildir format. Features include IMAP/SMTP support, OAuth2
  authentication (Microsoft & Google), email threading, background caching,
  bulk archive, and full import/export of .eml files.
license: MIT
grade: stable
confinement: strict
base: core22
icon: src-tauri/icons/128x128.png

apps:
  mailvault:
    command: usr/bin/mailvault
    extensions: [gnome]
    environment:
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      # The absolute paths hunspell searches belong to the base snap, not to us.
      DICPATH: $SNAP/usr/share/hunspell
      SSL_CERT_FILE: $SNAP/etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: $SNAP/etc/ssl/certs
    plugs:
      - network
      - network-bind
      # Without it the portal refuses NetworkMonitor ("not available inside
      # the sandbox"), GLib reports no network, and the webview's
      # navigator.onLine stays false for the whole session (issue #16).
      - network-status
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - home
      - password-manager-service

parts:
  mailvault:
    plugin: dump
    source: snap-staging/
    stage-packages:
      # Spell checking. A confined snap cannot see dictionaries installed on the
      # host, so it carries its own; enchant-2 comes with it because WebKitGTK
      # looks words up through enchant, and its `enchant-lsmod-2` is how the app
      # asks what is actually available rather than guessing from a directory.
      # More languages are a line each — the in-app dialog and the FAQ cover
      # anything not staged here.
      - enchant-2
      - hunspell-en-us
      - hunspell-en-gb
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libayatana-appindicator3-1
      - librsvg2-2
      - libssl3
      - libsecret-1-0
      - ca-certificates

  # The gnome extension mounts gnome-42-2204, which already ships GTK, WebKitGTK
  # and a Mesa matched to its own DRI drivers. The stage-packages above drag in
  # older jammy copies of the same libraries, and $SNAP/usr/lib comes first on
  # LD_LIBRARY_PATH, so the app paired the archive's libEGL with the content
  # snap's radeonsi_dri.so and died with "did not find extension DRI_Mesa
  # version 1" (issue #16). Drop every library the content snap provides, so
  # each one has a single source. usr/share and etc stay: DICPATH and
  # SSL_CERT_FILE point at our own copies there.
  cleanup:
    after: [mailvault]
    plugin: nil
    build-snaps: [gnome-42-2204]
    override-prime: |
      set -eu
      cd /snap/gnome-42-2204/current
      find lib usr/lib \( -type f -o -type l \) | while read -r f; do
        rm -f "$CRAFT_PRIME/$f"
      done
