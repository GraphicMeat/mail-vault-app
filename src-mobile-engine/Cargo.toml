[package]
name = "mailvault-mobile-engine"
version = "0.1.0"
description = "In-process mobile engine: owns mobile.db and answers the mobile shell's RPCs"
edition = "2021"
publish = false

[features]
# Seeds mobile.db with synthetic rows for the perf gate; never in a shipping build.
perf-gate = []

[dependencies]
# IMAP, TLS and the rest of the protocol code. Default features only: never `tls-rustls`, which
# would move the desktop build onto rustls through workspace feature unification (Android gets
# rustls by cfg inside core).
mailvault-core = { path = "../src-core" }
# Same requirement as core, so both resolve to one libsqlite3-sys.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Core's futures run on async-std; some of core's timeouts are tokio timers, which need a runtime
# whose driver is running (see net::block_on).
async-std = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
# Attachment cache file names (the same sha2 core already builds).
sha2 = "0.10"
# Outgoing attachments as core's builder takes them (the same base64 core already builds).
base64 = "0.22"
# JMAP session URLs as typed (the same url core already builds).
url = "2"
# The type of core's JMAP EventSource response, read chunk by chunk by the live thread (the same
# reqwest core already builds; no features of its own).
reqwest = { version = "0.12", default-features = false }
# The import's password, wiped when dropped (the same zeroize core already builds).
zeroize = "1"

[dev-dependencies]
tempfile = "3"
mock-imap = { path = "../src-mock-imap" }
mock-jmap = { path = "../src-mock-jmap" }

[target.'cfg(unix)'.dev-dependencies]
# Peak RSS for the attachment streaming test's report line.
libc = "0.2"

[[test]]
# The seed and the perf report exist only with perf-gate; the plain test build skips this file.
name = "perf_gate"
required-features = ["perf-gate"]
