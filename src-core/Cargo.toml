[package]
name = "mailvault-core"
version = "0.1.0"
description = "MailVault shared core — email types, Maildir operations, cache management"
authors = ["MailVault"]
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
# Fresh native zone names; same exact version already locked through chrono.
iana-time-zone = "=0.1.65"
base64 = "0.22"
mailparse = "0.15"
charset = "0.1"
walkdir = "2"
dirs = "5"
tracing = "0.1"
sha2 = "0.10"
regex = "1"
# The body scan (src/body_scan): an HTML document parsed the way the webview's DOMParser does. Same
# version blitz-html already pulls in through src-render, so the workspace builds one copy.
html5ever = "0.40"
# NFKC for the one-time code detector (src/verification_code.rs), as the app's JS read it.
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
# Transport/protocol deps for shared imap/graph/oauth2/dns modules.
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "rt", "macros"] }
async-imap = { version = "0.11", features = ["compress"] }
imap-proto = "0.16"
async-std = { version = "1", features = ["attributes"] }
# Runtime-agnostic timer for the IMAP command deadline (`CountingStream`):
# the same sessions run under tokio (daemon) and async-std (tests).
async-io = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hickory-resolver = "0.26"
rand = "0.9"
url = "2"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
# Offline search index (src/search_index): FTS5 trigram + contentless_delete need SQLite >= 3.43, so bundle it.
rusqlite = { version = "0.40", features = ["bundled"] }
zip = "9"
# Encrypted account transfer file (src/transfer).
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
# OpenPGP decryption (src/pgp.rs): pure Rust, no gpg, so the sandboxed builds can use it.
pgp = "0.20"
# Network Activity's map (src/geo_ip.rs): reads the bundled DB-IP country database.
maxminddb = "0.32"
# Insights day buckets in the viewer's IANA time zone (src/insights_model.rs).
# The tz database is bundled so the sandboxed and snap daemons never read /usr/share/zoneinfo.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always", "tz-system"] }


# The IMAP TLS seam (src/imap/tls.rs). Desktop and iOS use async-native-tls (target-gated below);
# Android has no usable OpenSSL, so it always uses rustls. `tls-rustls` selects rustls on any target.
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.6", optional = true }

[features]
tls-rustls = ["dep:futures-rustls", "dep:rustls", "dep:rustls-platform-verifier"]

[target.'cfg(not(target_os = "android"))'.dependencies]
async-native-tls = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.6"

# Snap keyring (src/snap_keyring.rs): the Secret portal through oo7, plugged
# into keyring-rs as its backend inside a snap.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
mock-imap = { path = "../src-mock-imap" }
mock-jmap = { path = "../src-mock-jmap" }
tempfile = "3"
# Self-signed acceptor for tests/imap_tls_rustls.rs.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
# Log output for examples/ms_imap_probe.rs.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# pgp 0.20 takes rand 0.8 RNGs; tests use it to make keys and encrypt fixtures.
rand08 = { package = "rand", version = "0.8" }
