[package]
name = "mailvault-mobile"
version = "0.1.0"
description = "Thin Tauri v2 mobile shell: window, OS integration, and daemon_rpc forwarded to the in-process engine"
edition = "2021"
publish = false

[lib]
# The generated Android project loads lib<name>.so and the iOS project links lib<name>.a.
name = "mailvault_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Seeds mobile.db with synthetic rows for the perf gate; never in a shipping build.
perf-gate = ["mailvault-mobile-engine/perf-gate"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No plugins beyond core. Never add mailvault-core here with `tls-rustls`: workspace feature
# unification would move the desktop build onto rustls.
tauri = { version = "2", features = [] }
serde_json = "1.0"
mailvault-mobile-engine = { path = "../src-mobile-engine" }
# The platform secret store behind the engine's SecretStore (src/secrets.rs).
keyring-core = "1"

[target.'cfg(target_os = "ios")'.dependencies]
# "protected": the data-protection keychain, the one an iOS app has.
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
# Core's rustls verifier on Android needs the app's JNI context before the first handshake
# (lib.rs, from the context tao stores in ndk-context). Same jni major the verifier uses.
rustls-platform-verifier = "0.6"
jni = "0.21"
ndk-context = "0.1"
