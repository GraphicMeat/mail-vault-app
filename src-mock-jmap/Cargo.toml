[package]
name = "mock-jmap"
version = "0.1.0"
description = "Scriptable in-process JMAP server for MailVault tests"
edition = "2021"
publish = false

[[bin]]
name = "mock-jmap-server"
path = "src/bin/server.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mailparse = "0.15"
base64 = "0.22"
sha2 = "0.10"
