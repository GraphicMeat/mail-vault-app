[workspace]
members = ["src-tauri", "src-daemon", "src-core", "src-mock-imap", "src-agent-probe", "vendor/imap-proto"]
resolver = "2"

# imap-proto 0.16.6 with three MailVault patches (see vendor/imap-proto/src/parser):
# iCloud's unescaped inner quotes in ENVELOPE, non-UTF-8 bytes in BODYSTRUCTURE
# params, and a FETCH line the grammar rejects costing one message instead of
# the connection (async-imap closes the stream on any decoder error).
[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }
