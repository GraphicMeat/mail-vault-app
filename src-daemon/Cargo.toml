[package]
name = "mailvault-daemon"
version = "0.1.0"
description = "MailVault background daemon — IMAP sync, backups, LLM inference"
authors = ["MailVault"]
edition = "2021"

[[bin]]
name = "mailvault-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mailparse = "0.15"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "rt", "rt-multi-thread", "macros", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rand = "0.9"
dirs = "5"
chrono = "0.4"
sha2 = "0.10"
flate2 = "1"
mailvault-core = { path = "../src-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.21"
hf-hub = "0.4"
uuid = { version = "1", features = ["v4"] }
# Task 4.2: `export_fetch::fetch_remote_asset` (moved from src-tauri) base64-encodes
# the fetched bytes for its RPC reply. Was test-only (Task 2.8's maildir_store
# fixture) until this move made it a real runtime dependency too.
base64 = "0.22"
# Task 4.3: `backup_zip::export`/`import` (moved from src-tauri) read/write
# backup ZIP archives directly. Same pin as src-core/Cargo.toml and
# src-tauri/Cargo.toml.
zip = "2"
# export_fetch's SSRF guard inspects url::Host directly (reqwest re-exports
# only Url, not Host). Pinned to the version reqwest 0.12 already vendors.
url = "2.5"

[dev-dependencies]
mock-imap = { path = "../src-mock-imap" }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.8", features = ["metal"] }
embed_plist = "1.2.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-pdf-kit = "0.3"
objc2-vision = "0.3"
# Task 5.1: resolve_account_credentials reads the same keychain entry the app
# writes. Mirrors src-tauri/Cargo.toml's keyring entry exactly.
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
pdf-extract = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
