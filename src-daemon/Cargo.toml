[package]
name = "mailvault-daemon"
version = "0.1.0"
description = "MailVault background daemon — IMAP sync, backups, LLM inference"
authors = ["MailVault"]
edition = "2021"

[[bin]]
name = "mailvault-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "rt", "rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rand = "0.9"
dirs = "5"
chrono = "0.4"
sha2 = "0.10"
flate2 = "1"
mailvault-core = { path = "../src-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.21"
hf-hub = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mock-imap = { path = "../src-mock-imap" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.8", features = ["metal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
