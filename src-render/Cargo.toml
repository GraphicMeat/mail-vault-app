[package]
name = "mailvault-render"
version = "0.1.0"
edition = "2021"
publish = false
description = "MailVault's Blitz email renderer (runs only in the daemon's render worker)"

[features]
# Paint tiles on the graphics card when the worker is started with --gpu (Settings toggle).
gpu = ["dep:anyrender_vello", "dep:pollster"]

[dependencies]
blitz-dom = { version = "=0.3.0-beta.4", features = ["floats"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
# multithreading: tiles raster on a few threads (raster.rs `raster_threads`). Vendored for
# `with_render_settings`, which caps them: two workers must not each take every core.
anyrender_vello_cpu = { version = "0.18", features = ["multithreading"] }
# GPU tile raster (`gpu` feature, raster.rs): vello on wgpu 30, the anyrender 0.14 line.
anyrender_vello = { version = "0.15", optional = true }
pollster = { version = "0.4", optional = true }
png = "0.17"
data-url = "0.3"
# Image header sizes, read before any decoder runs. Already in the lock via usvg (MIT).
imagesize = "0.15"
base64 = "0.22"
# Decodes `data:` background images for the dark pass (Dark Reader analyzeImage). Same formats and
# version blitz-dom already links; SVG is not decoded here.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same stylo blitz-dom declares, so one copy resolves; fontique is reached through parley.
# stylo_traits and parley also give the parity inspector computed-style and text-layout access.
style = { package = "stylo", version = "0.22" }
style_traits = { package = "stylo_traits", version = "0.22" }
parley = "0.12"
# Dark Reader's colour regexes use lookaheads (Dark Reader port, src/dark/); 0.13 is the lock's copy.
fancy-regex = "0.13"
# Named CSS colours for the port's colour parser (the same table Dark Reader hard-codes).
cssparser = "0.38"
