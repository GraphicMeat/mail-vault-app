[package]
name = "mailvault-render"
version = "0.1.0"
edition = "2021"
publish = false
description = "MailVault's Blitz email renderer (runs only in the daemon's render worker)"

[dependencies]
blitz-dom = { version = "=0.3.0-beta.2", features = ["floats"] }
blitz-html = "=0.3.0-beta.2"
blitz-paint = "=0.3.0-beta.2"
blitz-traits = "=0.3.0-beta.2"
anyrender = "0.13"
anyrender_vello_cpu = "0.17"
png = "0.17"
data-url = "0.3"
# Image header sizes, read before any decoder runs. Already in the lock via usvg (MIT).
imagesize = "0.15"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same stylo blitz-dom declares, so one copy resolves; fontique is reached through parley.
style = { package = "stylo", version = "0.20" }
parley = "0.11"
