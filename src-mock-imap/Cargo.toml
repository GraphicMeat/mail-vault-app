[package]
name = "mock-imap"
version = "0.1.0"
description = "Scriptable in-process IMAP server for MailVault tests — supports fault injection"
edition = "2021"
publish = false

[[bin]]
name = "mock-imap-server"
path = "src/bin/server.rs"

[dependencies]
chrono = "0.4"
mailparse = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
